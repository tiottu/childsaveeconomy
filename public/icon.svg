<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- 아이 통장 앱 아이콘 — 남자아이 · 여자아이가 동전을 함께 들고 있는 모습. -->
  <rect width="192" height="192" rx="42" fill="#e6f1fb"/>

  <!-- 그림자 -->
  <ellipse cx="96" cy="163" rx="56" ry="7" fill="#185fa5" opacity="0.10"/>

  <!-- 남자아이 몸통(셔츠) -->
  <path d="M34 142 L36 106 Q36 94 54 94 Q72 94 72 106 L72 142 Z" fill="#378add"/>
  <!-- 여자아이 몸통(원피스) -->
  <path d="M120 142 L120 106 Q120 94 138 94 Q156 94 158 106 L160 142 Z" fill="#f28fa8"/>

  <!-- 팔 — 가운데 동전 쪽으로 뻗는다 -->
  <rect x="66" y="116" width="24" height="10" rx="5" fill="#ffd9b3"/>
  <rect x="102" y="116" width="24" height="10" rx="5" fill="#ffd9b3"/>

  <!-- 남자아이 머리 -->
  <circle cx="54" cy="74" r="19" fill="#ffd9b3"/>
  <path d="M35 74 A19 19 0 0 1 73 74 Z" fill="#4a3728"/>
  <circle cx="47" cy="76" r="2.3" fill="#3a2a20"/>
  <circle cx="61" cy="76" r="2.3" fill="#3a2a20"/>
  <path d="M48 84 Q54 89 60 84" fill="none" stroke="#a35b45" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="43" cy="82" r="4.2" fill="#f5a3a3" opacity="0.6"/>
  <circle cx="65" cy="82" r="4.2" fill="#f5a3a3" opacity="0.6"/>

  <!-- 여자아이 머리 -->
  <circle cx="138" cy="74" r="19" fill="#ffd9b3"/>
  <circle cx="117" cy="80" r="8" fill="#6b4423"/>
  <circle cx="159" cy="80" r="8" fill="#6b4423"/>
  <path d="M119 74 A19 19 0 0 1 157 74 Z" fill="#6b4423"/>
  <circle cx="131" cy="76" r="2.3" fill="#3a2a20"/>
  <circle cx="145" cy="76" r="2.3" fill="#3a2a20"/>
  <path d="M132 84 Q138 89 144 84" fill="none" stroke="#a35b45" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="127" cy="82" r="4.2" fill="#f5a3a3" opacity="0.6"/>
  <circle cx="149" cy="82" r="4.2" fill="#f5a3a3" opacity="0.6"/>

  <!-- 가운데 동전 — 둘이 같이 든다 -->
  <circle cx="96" cy="122" r="32" fill="#f0b429" stroke="#c8871a" stroke-width="3"/>
  <ellipse cx="86" cy="111" rx="9" ry="6" fill="#fff" opacity="0.35"/>
  <text x="96" y="132" font-family="Arial, sans-serif" font-size="30" font-weight="700"
        fill="#8a5a12" text-anchor="middle">₩</text>
</svg>
